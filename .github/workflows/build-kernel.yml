name: Build N1 Linux kernel (no install)

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "iStoreOS source branch or tag"
        required: true
        default: "istoreos-25.12"
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build N1 kernel and modules (no device install)
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout iStoreOS source
        uses: actions/checkout@v4
        with:
          repository: istoreos/istoreos
          ref: ${{ inputs.source_ref }}
          path: istoreos
          fetch-depth: 1

      - name: Checkout kernel config baseline
        uses: actions/checkout@v4
        with:
          path: build-config
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib gettext git \
            libncurses-dev libssl-dev python3 python3-dev rsync unzip zlib1g-dev \
            file wget curl ca-certificates bc cpio libelf-dev dwarves device-tree-compiler

      - name: Download matching N1 config and enable Ftrace
        working-directory: istoreos
        run: |
          set -eu
          CONFIG_URL="https://fw20.koolcenter.com/iStoreOS/alpha/n1/config.seed"
          curl -fL --retry 3 --retry-delay 2 "$CONFIG_URL" -o .config
          test -s .config
          if ! grep -qi 'phicomm_n1' .config; then
            echo "::error::Config seed does not select the Phicomm N1 profile."
            exit 1
          fi

          for option in KERNEL_FTRACE KERNEL_FUNCTION_TRACER KERNEL_DYNAMIC_FTRACE; do
            sed -i -e "/^CONFIG_${option}=/d" -e "/^# CONFIG_${option} is not set$/d" .config
            printf 'CONFIG_%s=y\n' "$option" >> .config
          done

          make defconfig

          for option in KERNEL_FTRACE KERNEL_FUNCTION_TRACER KERNEL_DYNAMIC_FTRACE; do
            grep -qx "CONFIG_${option}=y" .config || {
              echo "::error::CONFIG_${option} was not retained by defconfig."
              exit 1
            }
          done

          echo "===== Selected N1 target ====="
          grep -E '^CONFIG_TARGET_(amlogic|amlogic_meson|DEVICE_amlogic_meson_DEVICE_phicomm_n1)=y$' .config

      - name: Apply current N1 kernel config as build baseline
        working-directory: istoreos
        shell: bash
        run: |
          set -euo pipefail
          BASELINE="$GITHUB_WORKSPACE/build-config/configs/n1-current-kernel.config"
          DEFAULTS="include/kernel-defaults.mk"

          test -s "$BASELINE"
          grep -qx '# Linux/arm64 6.12.112 Kernel Configuration' "$BASELINE"
          grep -qx 'CONFIG_FTRACE=y' "$BASELINE"
          grep -qx 'CONFIG_DEBUG_INFO_BTF=y' "$BASELINE"

          # iStoreOS first merges platform kernel fragments into .config.target.
          # Use the running N1 kernel config as the base, then let platform
          # fragments override it, followed by normal iStoreOS/package settings.
          python3 - "$DEFAULTS" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          content = path.read_text()
          marker = "# copy CONFIG_KERNEL_* settings over to .config.target"
          insertion = (
              "\t$(SCRIPT_DIR)/kconfig.pl + $(TOPDIR)/../build-config/configs/n1-current-kernel.config "
              "$(LINUX_DIR)/.config.target > $(LINUX_DIR)/.config.target.baseline\n"
              "\tmv $(LINUX_DIR)/.config.target.baseline $(LINUX_DIR)/.config.target\n"
          )
          if content.count(marker) != 1:
              raise SystemExit(
                  "Expected exactly one CONFIG_KERNEL marker in include/kernel-defaults.mk; "
                  "cannot safely apply the N1 baseline."
              )
          path.write_text(content.replace(marker, insertion + marker))
          print("Patched kernel-defaults.mk: current N1 config is now the kernel baseline")
          PY

      - name: Prepare patched Linux source
        working-directory: istoreos
        run: |
          set -eu
          make target/linux/prepare V=s

      - name: Build host tools and N1 toolchain
        working-directory: istoreos
        run: |
          set -eu
          # Keep parallelism conservative for the memory limit of GitHub-hosted runners.
          make -j2 tools/install toolchain/install V=s

      - name: Generate package metadata
        working-directory: istoreos
        run: |
          set -eu
          # OpenWrt/iStoreOS generates package metadata via prepare-tmpinfo.
          make prepare-tmpinfo V=s
          test -s tmp/.packageinfo
          test -s tmp/.packagedeps

      - name: Compile N1 kernel, modules and device trees (no install)
        working-directory: istoreos
        run: |
          set -eu
          make -j2 target/linux/compile V=s

      - name: Verify kernel config and collect build outputs
        working-directory: istoreos
        shell: bash
        run: |
          set -euo pipefail

          KERNEL_BUILD_DIR="build_dir/target-aarch64_cortex-a53_musl/linux-amlogic_meson"
          LINUX_DIR="$KERNEL_BUILD_DIR/linux-6.12.112"

          test -d "$LINUX_DIR"
          test -s "$LINUX_DIR/arch/arm64/boot/Image"

          echo "===== Final compiled kernel config ====="
          grep -qx 'CONFIG_DEBUG_INFO_BTF=y' "$LINUX_DIR/.config" || {
            echo "::error::Compiled kernel config lost CONFIG_DEBUG_INFO_BTF=y."
            exit 1
          }

          for option in FTRACE FUNCTION_TRACER DYNAMIC_FTRACE; do
            grep -qx "CONFIG_${option}=y" "$LINUX_DIR/.config" || {
              echo "::error::Compiled kernel config is missing CONFIG_${option}=y."
              grep -E "^(# )?CONFIG_${option}" "$LINUX_DIR/.config" || true
              exit 1
            }
            grep -E "^CONFIG_${option}=y$" "$LINUX_DIR/.config"
          done

          mkdir -p ../n1-kernel-build-output
          cp "$LINUX_DIR/.config" ../n1-kernel-build-output/kernel.config
          cp "$GITHUB_WORKSPACE/build-config/configs/n1-current-kernel.config" ../n1-kernel-build-output/kernel.config.baseline
          cp "$LINUX_DIR/arch/arm64/boot/Image" ../n1-kernel-build-output/Image

          python3 - "$GITHUB_WORKSPACE/build-config/configs/n1-current-kernel.config" "$LINUX_DIR/.config" > ../n1-kernel-build-output/kernel-config-diff.txt <<'PY'
          import re
          import sys

          def read_config(path):
              values = {}
              for line in open(path, encoding="utf-8"):
                  m = re.match(r"^(?:# )?CONFIG_(\w+)(?:=(.*)| is not set)$", line.rstrip())
                  if m:
                      values[m.group(1)] = m.group(2) if m.group(2) is not None else "n"
              return values

          before, after = map(read_config, sys.argv[1:])
          changed = [(key, before.get(key, "<unset>"), after.get(key, "<unset>"))
                     for key in sorted(set(before) | set(after))
                     if before.get(key, "<unset>") != after.get(key, "<unset>")]
          print(f"Current kernel config -> final build config: {len(changed)} changed symbols")
          for key, old, new in changed:
              print(f"{key}: {old} -> {new}")
          PY

          for file in vmlinux System.map Module.symvers modules.builtin modules.order; do
            if [ -s "$LINUX_DIR/$file" ]; then
              cp "$LINUX_DIR/$file" ../n1-kernel-build-output/
            fi
          done

          mkdir -p ../n1-kernel-build-output/dtb
          find "$LINUX_DIR/arch/arm64/boot/dts" -type f -name '*.dtb' \
            -exec cp --parents {} ../n1-kernel-build-output/dtb/ \;

          mkdir -p ../n1-kernel-build-output/modules
          find "$LINUX_DIR" -type f -name '*.ko' \
            -exec cp --parents {} ../n1-kernel-build-output/modules/ \;

          echo "===== Kernel build output ====="
          find ../n1-kernel-build-output -type f -printf '%p %s bytes\n' | sort
          test -s ../n1-kernel-build-output/Image
          test -s ../n1-kernel-build-output/kernel.config

      - name: Upload N1 kernel build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: n1-linux-6.12.112-ftrace-build
          path: n1-kernel-build-output/
          if-no-files-found: error
          retention-days: 14
