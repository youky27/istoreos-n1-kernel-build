name: Prepare N1 kernel config

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "iStoreOS source branch or tag"
        required: true
        default: "istoreos-25.12"
        type: string

permissions:
  contents: read

jobs:
  prepare:
    name: Validate N1 kernel options (no kernel compile)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout iStoreOS source
        uses: actions/checkout@v4
        with:
          repository: istoreos/istoreos
          ref: ${{ inputs.source_ref }}
          path: istoreos
          fetch-depth: 1

      - name: Install configuration dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex gawk gettext git libelf-dev libncurses-dev libssl-dev perl python3 rsync unzip zlib1g-dev file wget curl ca-certificates

      - name: Download the matching N1 build config
        working-directory: istoreos
        run: |
          set -eu
          CONFIG_URL="https://fw20.koolcenter.com/iStoreOS/alpha/n1/config.seed"
          echo "Downloading the currently published N1 config seed"
          curl -fL --retry 3 --retry-delay 2 "$CONFIG_URL" -o .config
          test -s .config
          echo "===== N1 target selection in source config ====="
          grep -Ei 'TARGET.*(amlogic|meson|phicomm_n1)' .config | head -40 || true
          if ! grep -qi 'phicomm_n1' .config; then
            echo "::error::The downloaded config seed does not appear to select the Phicomm N1 profile."
            exit 1
          fi

      - name: Enable Function Tracer and Dynamic Ftrace
        working-directory: istoreos
        run: |
          set -eu
          # OpenWrt's scripts/config is a source directory, not an executable.
          # Set the three Kconfig symbols in the seed before resolving dependencies.
          for option in KERNEL_FTRACE KERNEL_FUNCTION_TRACER KERNEL_DYNAMIC_FTRACE; do
            sed -i -e "/^CONFIG_${option}=/d" -e "/^# CONFIG_${option} is not set$/d" .config
            printf 'CONFIG_%s=y\n' "$option" >> .config
          done

          make defconfig

          echo "===== Verified OpenWrt build config ====="
          grep -E '^CONFIG_KERNEL_(FTRACE|FUNCTION_TRACER|DYNAMIC_FTRACE)=y$' .config
          for option in KERNEL_FTRACE KERNEL_FUNCTION_TRACER KERNEL_DYNAMIC_FTRACE; do
            if ! grep -qx "CONFIG_${option}=y" .config; then
              echo "::error::CONFIG_${option} did not remain enabled after make defconfig."
              exit 1
            fi
          done
          cp .config ../n1-kernel-config.preview

      - name: Prepare patched Linux source (no compile)
        working-directory: istoreos
        run: |
          set -eu
          make target/linux/prepare V=s

      - name: Generate and verify final Linux kernel config (no kernel compile)
        working-directory: istoreos
        shell: bash
        run: |
          set -euo pipefail

          # Read the exact paths and Kconfig merge command from the N1 target Makefile.
          mapfile -t kernel_vars < <(
            make --no-print-directory -s -C target/linux/amlogic TOPDIR="$GITHUB_WORKSPACE/istoreos" \
              --eval='print-kernel-vars:;@printf "%s\\n" "$(LINUX_DIR)" "$(LINUX_CONF_CMD)" "$(TMP_DIR)" "$(KERNEL_PATCHVER)"' \
              print-kernel-vars
          )

          if [ "${#kernel_vars[@]}" -ne 4 ]; then
            echo "::error::Could not resolve the Linux kernel build variables."
            printf '%s\\n' "${kernel_vars[@]}"
            exit 1
          fi

          LINUX_DIR="${kernel_vars[0]}"
          LINUX_CONF_CMD="${kernel_vars[1]}"
          TMP_DIR="${kernel_vars[2]}"
          KERNEL_PATCHVER="${kernel_vars[3]}"

          echo "Linux source directory: $LINUX_DIR"
          echo "Kernel patch version: $KERNEL_PATCHVER"
          test -d "$LINUX_DIR"

          # The official Kernel/Configure recipe uses this package metadata file.
          if [ ! -s "$TMP_DIR/.packageinfo" ]; then
            make package-metadata
          fi
          test -s "$TMP_DIR/.packageinfo"

          # Reproduce the configuration-generation portion of
          # include/kernel-defaults.mk:Kernel/Configure/Default.
          eval "$LINUX_CONF_CMD > \"$LINUX_DIR/.config.target\""

          awk '/^(#[[:space:]]+)?CONFIG_KERNEL/{sub("CONFIG_KERNEL_","CONFIG_");print}' .config \
            >> "$LINUX_DIR/.config.target"

          echo "# CONFIG_KALLSYMS_EXTRA_PASS is not set" >> "$LINUX_DIR/.config.target"
          echo "# CONFIG_KALLSYMS_ALL is not set" >> "$LINUX_DIR/.config.target"
          echo "CONFIG_KALLSYMS_UNCOMPRESSED=y" >> "$LINUX_DIR/.config.target"

          ./scripts/package-metadata.pl kconfig "$TMP_DIR/.packageinfo" .config "$KERNEL_PATCHVER" \
            > "$LINUX_DIR/.config.override"

          ./scripts/kconfig.pl 'm+' '+' "$LINUX_DIR/.config.target" /dev/null \
            "$LINUX_DIR/.config.override" > "$LINUX_DIR/.config.set"

          mv "$LINUX_DIR/.config.set" "$LINUX_DIR/.config.old"
          grep -v INITRAMFS "$LINUX_DIR/.config.old" > "$LINUX_DIR/.config.set"
          echo 'CONFIG_INITRAMFS_SOURCE=""' >> "$LINUX_DIR/.config.set"
          echo '# CONFIG_INITRAMFS_FORCE is not set' >> "$LINUX_DIR/.config.set"
          echo "# CONFIG_INITRAMFS_PRESERVE_MTIME is not set" >> "$LINUX_DIR/.config.set"

          # Kconfig olddefconfig resolves dependencies and writes the real kernel .config.
          cp "$LINUX_DIR/.config.set" "$LINUX_DIR/.config"
          make -C "$LINUX_DIR" ARCH=arm64 olddefconfig

          echo "===== Final Linux kernel config ====="
          grep -E '^CONFIG_(FTRACE|FUNCTION_TRACER|DYNAMIC_FTRACE)=y$' "$LINUX_DIR/.config"

          for option in FTRACE FUNCTION_TRACER DYNAMIC_FTRACE; do
            if ! grep -qx "CONFIG_${option}=y" "$LINUX_DIR/.config"; then
              echo "::error::Final kernel config does not contain CONFIG_${option}=y."
              grep -E "^(# )?CONFIG_${option}" "$LINUX_DIR/.config" || true
              exit 1
            fi
          done

          cp "$LINUX_DIR/.config" ../n1-linux-kernel.config.preview

      - name: Upload validated OpenWrt config preview
        uses: actions/upload-artifact@v4
        with:
          name: n1-kernel-config-preview
          path: n1-kernel-config.preview
          if-no-files-found: error
          retention-days: 14

      - name: Upload final Linux kernel config preview
        uses: actions/upload-artifact@v4
        with:
          name: n1-linux-kernel-config-preview
          path: n1-linux-kernel.config.preview
          if-no-files-found: error
          retention-days: 14
